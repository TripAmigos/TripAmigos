  <!-- Band zigzag -->
  <path d="M40 45 L44 42 L48 48 L52 42 L56 48 L60 42 L64 48 L68 42 L72 48 L76 42 L80 45" stroke="#A3B7A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

