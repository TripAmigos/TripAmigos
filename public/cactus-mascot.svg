  <path d="M30 128 L36 155 Q60 162 84 155 L90 128 Z" fill="url(#potShade)"/>
  <ellipse cx="60" cy="128" rx="30" ry="4" fill="#d4816f"/>

  <!-- Body -->
  <rect x="42" y="52" rx="16" ry="16" width="36" height="80" fill="#A3B7A0"/>
  <!-- Body lines -->
  <line x1="52" y1="58" x2="52" y2="125" stroke="#8a9e87" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="55" x2="60" y2="128" stroke="#8a9e87" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="58" x2="68" y2="125" stroke="#8a9e87" stroke-width="1" stroke-linecap="round"/>

  <!-- Left arm -->
