  <ellipse cx="68" cy="82" rx="3.5" ry="4" fill="#3A3532"/>
  <!-- Eye highlights -->
  <circle cx="53.5" cy="80.5" r="1.2" fill="white"/>
  <circle cx="69.5" cy="80.5" r="1.2" fill="white"/>

  <!-- Smile -->
  <path d="M52 92 Q60 100 68 92" stroke="#3A3532" stroke-width="2" fill="none" stroke-linecap="round"/>

  <defs>
    <linearGradient id="potShade" x1="60" y1="128" x2="60" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.1"/>
      <stop offset="1" stop-color="black" stop-opacity="0.1"/>
