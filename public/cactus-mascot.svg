  <line x1="40" y1="65" x2="35" y2="62" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="35" y2="78" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="95" x2="35" y2="93" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="110" x2="35" y2="108" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="65" x2="85" y2="62" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="85" y2="78" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="85" y2="93" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="110" x2="85" y2="108" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arm spines -->
  <line x1="24" y1="88" x2="19" y2="86" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="100" x2="19" y2="99" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="88" x2="101" y2="86" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="100" x2="101" y2="99" stroke="#3A3532" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sombrero brim -->
  <ellipse cx="60" cy="52" rx="42" ry="10" fill="#C86552"/>
