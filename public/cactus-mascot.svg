  <ellipse cx="60" cy="52" rx="42" ry="10" fill="#C86552"/>
  <path d="M18 52 Q60 58 102 52" stroke="#b5574a" stroke-width="0.5" fill="none"/>
  <!-- Brim trim -->
  <path d="M22 50 L28 46 L34 50 L40 46 L46 50 L52 46 L58 50 L64 46 L70 50 L76 46 L82 50 L88 46 L94 50 L98 48" stroke="#A3B7A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sombrero top -->
  <path d="M38 52 Q38 28 60 22 Q82 28 82 52" fill="#C86552"/>
  <ellipse cx="60" cy="52" rx="22" ry="5" fill="#d4816f"/>
